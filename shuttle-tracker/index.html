<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shuttle Tracker</title><style>:root{--a:#c2185b}body{font:16px/1.5 system-ui,sans-serif;margin:0;background:#f7f7f5;color:#1c1c1c}main{max-width:480px;margin:0 auto;padding:24px 16px}h1{font-size:1.6rem;margin:0 0 4px}.s{color:#666;margin:0 0 20px}input,select,button{font:inherit;padding:10px;border:1px solid #ccc;border-radius:8px;width:100%;box-sizing:border-box;margin:4px 0}button{background:var(--a);color:#fff;border:0;cursor:pointer}.c{background:#fff;border-left:4px solid var(--a);padding:12px;margin:8px 0;border-radius:6px}.m{color:#666;font-size:.9rem}</style></head><body><main><h1>Shuttle Tracker</h1><p class="s">See when the next campus shuttle leaves.</p><div id=o></div></main><script>const $=i=>document.getElementById(i);const B={"Main Gate → Hostels":["08:00","09:30","11:00","13:00","15:30","18:00"],"Hostels → Academic Block":["08:15","09:45","12:00","14:00","16:30"],"Academic Block → Metro":["10:00","12:30","15:00","17:30","19:00"]};function r(){const n=new Date(),c=n.getHours()*60+n.getMinutes();$("o").innerHTML=Object.entries(B).map(([k,v])=>{const x=v.find(t=>{const[h,m]=t.split(":");return h*60+ +m>=c});let s="No more trips today";if(x){const[h,m]=x.split(":");s=x+" (in "+(h*60+ +m-c)+" min)"}return'<div class=c><b>'+k+'</b><div class=m>Next: '+s+'</div></div>'}).join("")}r();setInterval(r,30000)</script></body></html>
