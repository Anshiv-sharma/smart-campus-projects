<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exam Countdown</title><style>:root{--a:#0b6e99}body{font:16px/1.5 system-ui,sans-serif;margin:0;background:#f7f7f5;color:#1c1c1c}main{max-width:480px;margin:0 auto;padding:24px 16px}h1{font-size:1.6rem;margin:0 0 4px}.s{color:#666;margin:0 0 20px}input,select,button{font:inherit;padding:10px;border:1px solid #ccc;border-radius:8px;width:100%;box-sizing:border-box;margin:4px 0}button{background:var(--a);color:#fff;border:0;cursor:pointer}.c{background:#fff;border-left:4px solid var(--a);padding:12px;margin:8px 0;border-radius:6px}.m{color:#666;font-size:.9rem}</style></head><body><main><h1>Exam Countdown</h1><p class="s">Add your exams and see how many days you have left.</p><input id=n placeholder="Subject"><input id=d type=date><button onclick=add()>Add exam</button><div id=o></div></main><script>const $=i=>document.getElementById(i);let E=[];function r(){$("o").innerHTML=E.sort((a,b)=>a.d-b.d).map(e=>{const n=Math.ceil((e.d-new Date())/864e5);return'<div class=c><b>'+e.n+'</b><div class=m>'+(n<0?"Done":n+" day(s) left")+'</div></div>'}).join("")||'<p class=m>No exams yet. Add one above.</p>'}function add(){if(!$("n").value||!$("d").value)return;E.push({n:$("n").value,d:new Date($("d").value)});$("n").value="";r()}r()</script></body></html>
