<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lost & Found</title><style>:root{--a:#7a4bd1}body{font:16px/1.5 system-ui,sans-serif;margin:0;background:#f7f7f5;color:#1c1c1c}main{max-width:480px;margin:0 auto;padding:24px 16px}h1{font-size:1.6rem;margin:0 0 4px}.s{color:#666;margin:0 0 20px}input,select,button{font:inherit;padding:10px;border:1px solid #ccc;border-radius:8px;width:100%;box-sizing:border-box;margin:4px 0}button{background:var(--a);color:#fff;border:0;cursor:pointer}.c{background:#fff;border-left:4px solid var(--a);padding:12px;margin:8px 0;border-radius:6px}.m{color:#666;font-size:.9rem}</style></head><body><main><h1>Lost & Found</h1><p class="s">One shared board for lost and found items around campus.</p><input id=n placeholder="Item (e.g. blue water bottle)"><input id=w placeholder="Where was it?"><select id=k><option>Lost<option>Found</select><button onclick=add()>Post</button><div id=o></div></main><script>const $=i=>document.getElementById(i);const L=[{n:"Black umbrella",w:"Library",k:"Found"},{n:"ID card (Rahul)",w:"Canteen",k:"Lost"}];function r(){$("o").innerHTML=L.map(i=>'<div class=c><b>'+i.k+':</b> '+i.n+'<div class=m>'+i.w+'</div></div>').join("")}function add(){if(!$("n").value)return;L.unshift({n:$("n").value,w:$("w").value||"Unknown",k:$("k").value});$("n").value=$("w").value="";r()}r()</script></body></html>
