<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hostel Split</title><style>:root{--a:#1b5e20}body{font:16px/1.5 system-ui,sans-serif;margin:0;background:#f7f7f5;color:#1c1c1c}main{max-width:480px;margin:0 auto;padding:24px 16px}h1{font-size:1.6rem;margin:0 0 4px}.s{color:#666;margin:0 0 20px}input,select,button{font:inherit;padding:10px;border:1px solid #ccc;border-radius:8px;width:100%;box-sizing:border-box;margin:4px 0}button{background:var(--a);color:#fff;border:0;cursor:pointer}.c{background:#fff;border-left:4px solid var(--a);padding:12px;margin:8px 0;border-radius:6px}.m{color:#666;font-size:.9rem}</style></head><body><main><h1>Hostel Split</h1><p class="s">Split a shared bill between roommates in seconds.</p><input id=t type=number placeholder="Total bill (₹)"><input id=p type=number placeholder="Number of people"><button onclick=go()>Split</button><div id=o></div></main><script>const $=i=>document.getElementById(i);function go(){const t=+$("t").value,p=+$("p").value;$("o").innerHTML=t>0&&p>0?'<div class=c>Each person pays <b>₹'+(t/p).toFixed(2)+'</b></div>':'<div class=c>Enter a total and number of people.</div>'}</script></body></html>
