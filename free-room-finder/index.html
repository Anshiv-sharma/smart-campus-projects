<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Free Room Finder</title><style>:root{--a:#2a7de1}body{font:16px/1.5 system-ui,sans-serif;margin:0;background:#f7f7f5;color:#1c1c1c}main{max-width:480px;margin:0 auto;padding:24px 16px}h1{font-size:1.6rem;margin:0 0 4px}.s{color:#666;margin:0 0 20px}input,select,button{font:inherit;padding:10px;border:1px solid #ccc;border-radius:8px;width:100%;box-sizing:border-box;margin:4px 0}button{background:var(--a);color:#fff;border:0;cursor:pointer}.c{background:#fff;border-left:4px solid var(--a);padding:12px;margin:8px 0;border-radius:6px}.m{color:#666;font-size:.9rem}</style></head><body><main><h1>Free Room Finder</h1><p class="s">Find an empty classroom to study in during any slot.</p><select id=s></select><div id=o></div></main><script>const $=i=>document.getElementById(i);const R={"9-10":["A101","B204","Lab 3"],"10-11":["B204","C12"],"11-12":["A101","C12","Library Hall"],"12-1":["A101","B204","C12","Lab 3"],"2-3":["Lab 3","Library Hall"],"3-4":["A101","B204"]};Object.keys(R).forEach(x=>$("s").add(new Option(x,x)));function r(){$("o").innerHTML=R[$("s").value].map(x=>'<div class=c>'+x+'<div class=m>Free this slot</div></div>').join("")}$("s").onchange=r;r()</script></body></html>
