<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bunk Meter</title><style>:root{--a:#d6452f}body{font:16px/1.5 system-ui,sans-serif;margin:0;background:#f7f7f5;color:#1c1c1c}main{max-width:480px;margin:0 auto;padding:24px 16px}h1{font-size:1.6rem;margin:0 0 4px}.s{color:#666;margin:0 0 20px}input,select,button{font:inherit;padding:10px;border:1px solid #ccc;border-radius:8px;width:100%;box-sizing:border-box;margin:4px 0}button{background:var(--a);color:#fff;border:0;cursor:pointer}.c{background:#fff;border-left:4px solid var(--a);padding:12px;margin:8px 0;border-radius:6px}.m{color:#666;font-size:.9rem}</style></head><body><main><h1>Bunk Meter</h1><p class="s">Know how many classes you can skip, or must attend, to stay above the attendance cut-off.</p><input id=a type=number placeholder="Classes attended"><input id=t type=number placeholder="Total classes held"><input id=g type=number value=75 placeholder="Required %"><button onclick=go()>Check</button><div id=o></div></main><script>const $=i=>document.getElementById(i);function go(){const a=+$("a").value,t=+$("t").value,g=+$("g").value/100;if(!t||a>t)return $("o").innerHTML='<div class=c>Enter valid numbers.</div>';const p=a/t*100;let m;if(p>=g*100){m="You can safely skip "+Math.floor(a/g-t)+" more class(es)."}else{m="Attend "+Math.ceil((g*t-a)/(1-g))+" class(es) in a row to recover."}$("o").innerHTML='<div class=c><b>'+p.toFixed(1)+'%</b><br>'+m+'</div>'}</script></body></html>
