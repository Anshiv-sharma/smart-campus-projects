<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Buddy Matcher</title><style>:root{--a:#12906b}body{font:16px/1.5 system-ui,sans-serif;margin:0;background:#f7f7f5;color:#1c1c1c}main{max-width:480px;margin:0 auto;padding:24px 16px}h1{font-size:1.6rem;margin:0 0 4px}.s{color:#666;margin:0 0 20px}input,select,button{font:inherit;padding:10px;border:1px solid #ccc;border-radius:8px;width:100%;box-sizing:border-box;margin:4px 0}button{background:var(--a);color:#fff;border:0;cursor:pointer}.c{background:#fff;border-left:4px solid var(--a);padding:12px;margin:8px 0;border-radius:6px}.m{color:#666;font-size:.9rem}</style></head><body><main><h1>Study Buddy Matcher</h1><p class="s">Pick a subject and see classmates who want to study it too.</p><select id=s></select><div id=o></div></main><script>const $=i=>document.getElementById(i);const P=[["Aarav","DSA","Evenings"],["Meera","DSA","Weekends"],["Kabir","DBMS","Evenings"],["Sana","OOPS in Python","Mornings"],["Dev","OOPS in Python","Evenings"],["Isha","Maths","Weekends"]];[...new Set(P.map(p=>p[1]))].forEach(x=>$("s").add(new Option(x,x)));function r(){$("o").innerHTML=P.filter(p=>p[1]==$("s").value).map(p=>'<div class=c><b>'+p[0]+'</b><div class=m>Free: '+p[2]+'</div></div>').join("")}$("s").onchange=r;r()</script></body></html>
