<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mess Menu</title><style>:root{--a:#e08a00}body{font:16px/1.5 system-ui,sans-serif;margin:0;background:#f7f7f5;color:#1c1c1c}main{max-width:480px;margin:0 auto;padding:24px 16px}h1{font-size:1.6rem;margin:0 0 4px}.s{color:#666;margin:0 0 20px}input,select,button{font:inherit;padding:10px;border:1px solid #ccc;border-radius:8px;width:100%;box-sizing:border-box;margin:4px 0}button{background:var(--a);color:#fff;border:0;cursor:pointer}.c{background:#fff;border-left:4px solid var(--a);padding:12px;margin:8px 0;border-radius:6px}.m{color:#666;font-size:.9rem}</style></head><body><main><h1>Mess Menu</h1><p class="s">Today's hostel mess menu, without walking down to read the notice board.</p><select id=d></select><div id=o></div></main><script>const $=i=>document.getElementById(i);const M={Mon:["Poha","Dal, rice, roti","Paneer, naan"],Tue:["Idli sambar","Rajma chawal","Veg biryani"],Wed:["Paratha","Chole, rice","Egg curry / Soya chaap"],Thu:["Upma","Kadhi chawal","Mixed veg, roti"],Fri:["Bread omelette","Dal fry, jeera rice","Fried rice, manchurian"],Sat:["Aloo puri","Pav bhaji","Pasta night"],Sun:["Dosa","Special thali","Khichdi"]};const k=Object.keys(M);k.forEach(x=>$("d").add(new Option(x,x)));$("d").value=k[(new Date().getDay()+6)%7];function r(){const m=M[$("d").value];$("o").innerHTML=["Breakfast","Lunch","Dinner"].map((n,i)=>'<div class=c><b>'+n+'</b><br>'+m[i]+'</div>').join("")}$("d").onchange=r;r()</script></body></html>
