<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Event Hub</title><style>:root{--a:#6a1b9a}body{font:16px/1.5 system-ui,sans-serif;margin:0;background:#f7f7f5;color:#1c1c1c}main{max-width:480px;margin:0 auto;padding:24px 16px}h1{font-size:1.6rem;margin:0 0 4px}.s{color:#666;margin:0 0 20px}input,select,button{font:inherit;padding:10px;border:1px solid #ccc;border-radius:8px;width:100%;box-sizing:border-box;margin:4px 0}button{background:var(--a);color:#fff;border:0;cursor:pointer}.c{background:#fff;border-left:4px solid var(--a);padding:12px;margin:8px 0;border-radius:6px}.m{color:#666;font-size:.9rem}</style></head><body><main><h1>Event Hub</h1><p class="s">Every club event in one place. RSVP in a tap.</p><select id=f><option>All<option>Tech<option>Cultural<option>Sports</select><div id=o></div></main><script>const $=i=>document.getElementById(i);const V=[{n:"Hack Night",c:"Tech",r:0},{n:"Open Mic",c:"Cultural",r:0},{n:"Inter-hostel Cricket",c:"Sports",r:0},{n:"Intro to Git",c:"Tech",r:0}];function r(){$("o").innerHTML=V.filter(e=>$("f").value=="All"||e.c==$("f").value).map(e=>'<div class=c><b>'+e.n+'</b><div class=m>'+e.c+' · '+e.r+' going</div><button onclick="g('+V.indexOf(e)+')">RSVP</button></div>').join("")}function g(i){V[i].r++;r()}$("f").onchange=r;r()</script></body></html>
