<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Canteen Queue</title><style>:root{--a:#b5651d}body{font:16px/1.5 system-ui,sans-serif;margin:0;background:#f7f7f5;color:#1c1c1c}main{max-width:480px;margin:0 auto;padding:24px 16px}h1{font-size:1.6rem;margin:0 0 4px}.s{color:#666;margin:0 0 20px}input,select,button{font:inherit;padding:10px;border:1px solid #ccc;border-radius:8px;width:100%;box-sizing:border-box;margin:4px 0}button{background:var(--a);color:#fff;border:0;cursor:pointer}.c{background:#fff;border-left:4px solid var(--a);padding:12px;margin:8px 0;border-radius:6px}.m{color:#666;font-size:.9rem}</style></head><body><main><h1>Canteen Queue</h1><p class="s">Check which canteen is crowded before you go.</p><div id=o></div></main><script>const $=i=>document.getElementById(i);const C=[{n:"Main Canteen",l:2},{n:"Juice Corner",l:0},{n:"Night Mess",l:1}],N=["Quiet","Moderate","Packed"];function r(){$("o").innerHTML=C.map((c,i)=>'<div class=c><b>'+c.n+'</b><div class=m>'+N[c.l]+'</div><button onclick="u('+i+',1)">Report busier</button><button onclick="u('+i+',-1)" style="background:#666">Report quieter</button></div>').join("")}function u(i,d){C[i].l=Math.max(0,Math.min(2,C[i].l+d));r()}r()</script></body></html>
